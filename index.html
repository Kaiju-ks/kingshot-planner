<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HEX Kingshot Planner</title>
<style>
body{
  margin:0;
  background:#eef2f7;
  font-family:Inter, Arial, sans-serif;
  overflow:hidden;
}

#toolbar{
  position:fixed;
  top:20px;
  left:20px;
  width:240px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border:1px solid #dbe4ee;
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.05);
  z-index:1000;
}

#title{
  font-size:18px;
  font-weight:700;
  color:#1e293b;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid #e2e8f0;
}

button{
  display:block;
  width:100%;
  margin-bottom:8px;
  padding:12px;
  background:white;
  color:#334155;
  border:1px solid #dbe4ee;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.active{
  background:#7c3aed;
  color:white;
  border-color:#7c3aed;
}

input{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  padding:12px;
  border:1px solid #dbe4ee;
  border-radius:10px;
}

#help{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid #e2e8f0;
  color:#64748b;
  font-size:12px;
  line-height:1.6;
}

#stats{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #e2e8f0;
  color:#64748b;
  font-size:13px;
  line-height:1.7;
}

svg{
  width:100vw;
  height:100vh;
  cursor:crosshair;
}

text{
  fill:white;
  font-size:12px;
  font-weight:700;
  stroke:rgba(0,0,0,.55);
  stroke-width:1.5;
  paint-order:stroke;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="toolbar">
  <div id="title">HEX Alliance Planner</div>

  <button onclick="setTool('city')" id="cityBtn">🏰 City</button>
  <button onclick="setTool('mill')" id="millBtn">🏭 Mill</button>
  <button onclick="setTool('flag')" id="flagBtn">🚩 Flag</button>
  <button onclick="setTool('bear')" id="bearBtn">🐻 Bear Trap</button>

  <input id="labelInput" placeholder="Custom label">

<div id="help">
  <b>Controls</b><br>
  • Left Click → Place Structure<br>
  • Right Click → Delete Structure<br>
  • Hold Middle Mouse → Pan Map<br>
  • Mouse Wheel → Zoom In/Out
</div>

<div id="stats">
<b>Structures</b><br>
Cities: <span id="cityCount">0</span><br>
Mills: <span id="millCount">0</span><br>
Flags: <span id="flagCount">0</span><br>
Bears: <span id="bearCount">0</span>
</div>
</div>

<svg id="canvas"></svg>

<script>
const svg = document.getElementById("canvas");
const gridSize = 40;

let currentTool = "city";
let selected = null;
let isDragging = false;

let centerOffsetX = 0;
let centerOffsetY = 0;

const counters = { city:1, mill:1, flag:1, bear:1 };

let zoomLevel = 1;
let panX = 0;
let panY = 0;
let panning = false;
let startPanX = 0;
let startPanY = 0;

function updateView(){
  svg.style.transform = `translate(${panX}px,${panY}px) scale(${zoomLevel})`;
  svg.style.transformOrigin = "center center";
}

function updateCounts(){
 let city=0,mill=0,flag=0,bear=0;

 document.querySelectorAll("svg g").forEach(g=>{
   const type=g.dataset.type;
   if(type==="city") city++;
   else if(type==="mill") mill++;
   else if(type==="flag") flag++;
   else if(type==="bear") bear++;
 });

 document.getElementById("cityCount").textContent=city;
 document.getElementById("millCount").textContent=mill;
 document.getElementById("flagCount").textContent=flag;
 document.getElementById("bearCount").textContent=bear;
}

function setTool(tool){
  currentTool = tool;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById(tool+"Btn").classList.add("active");
}
setTool("city");

function drawGrid(){
  const half = gridSize/2;

  const width = window.innerWidth;
  const height = window.innerHeight;

  centerOffsetX = Math.floor(width / 2 / gridSize) * gridSize;
  centerOffsetY = Math.floor(height / 2 / (gridSize/2)) * (gridSize/2);

const cols = 750;
const rows = 750;

  for(let row=-rows/2; row<rows/2; row++){
    for(let col=-cols/2; col<cols/2; col++){

      const x = centerOffsetX + col*gridSize + (row%2 ? half : 0);
      const y = centerOffsetY + row*half;

      const d = document.createElementNS("http://www.w3.org/2000/svg","polygon");

      d.setAttribute("points",`
        ${x},${y-half}
        ${x+half},${y}
        ${x},${y+half}
        ${x-half},${y}
      `);

      const fillColor = ((row+col)%2===0) ? "#fafafa" : "#f3f4f6";

      d.setAttribute("fill", fillColor);
d.setAttribute("stroke", "#94a3b8");
d.setAttribute("stroke-width", "1.5");

      svg.appendChild(d);
    }
  }
}
drawGrid();

function snap(x,y){
  x -= centerOffsetX;
  y -= centerOffsetY;

  const row = Math.round(y/(gridSize/2));
  const offset = row%2 ? gridSize/2 : 0;
  const col = Math.round((x-offset)/gridSize);

  return {
    x: col*gridSize + offset + centerOffsetX,
    y: row*(gridSize/2) + centerOffsetY
  };
}

function drawTile(cx,cy,color){
  const h = gridSize/2;

  const p = document.createElementNS("http://www.w3.org/2000/svg","polygon");

  p.setAttribute("points",`
    ${cx},${cy-h}
    ${cx+h},${cy}
    ${cx},${cy+h}
    ${cx-h},${cy}
  `);

  p.setAttribute("fill",color);
  p.setAttribute("stroke","#00000055");
  p.setAttribute("stroke-width","1.2");
  p.style.filter="drop-shadow(0px 2px 3px rgba(0,0,0,.18))";

  return p;
}

function createBuilding(type,x,y){
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");

  if(type==="city"||type==="mill"){
    const color = type==="city" ? "#7c3aed" : "#14b8a6";

    const offsets = [
      {dx:0,dy:0},
      {dx:gridSize/2,dy:gridSize/2},
      {dx:-gridSize/2,dy:gridSize/2},
      {dx:0,dy:gridSize}
    ];

    offsets.forEach(o=>g.appendChild(drawTile(x+o.dx,y+o.dy,color)));
    const outline = document.createElementNS(
  "http://www.w3.org/2000/svg",
  "polygon"
);

outline.setAttribute("points", `
  ${x},${y-gridSize/2}
  ${x+gridSize},${y+gridSize/2}
  ${x},${y+gridSize*1.5}
  ${x-gridSize},${y+gridSize/2}
`);

outline.setAttribute("fill","none");
outline.setAttribute("stroke","#111827");
outline.setAttribute("stroke-width","2");
outline.setAttribute("pointer-events","none");

g.appendChild(outline);
}

  else if(type==="bear"){
    const offsets=[
      {dx:0,dy:0},{dx:gridSize,dy:0},{dx:-gridSize,dy:0},
      {dx:gridSize/2,dy:gridSize/2},{dx:-gridSize/2,dy:gridSize/2},
      {dx:gridSize/2,dy:-gridSize/2},{dx:-gridSize/2,dy:-gridSize/2},
      {dx:0,dy:gridSize},{dx:0,dy:-gridSize}
    ];
    offsets.forEach(o=>g.appendChild(drawTile(x+o.dx,y+o.dy,"#b45309")));
  }

  else {
    g.appendChild(drawTile(x,y,"#eab308"));

    const size = gridSize * 7;
    const diamond = document.createElementNS("http://www.w3.org/2000/svg","polygon");

    diamond.setAttribute("points",`
      ${x},${y-size/2}
      ${x+size/2},${y}
      ${x},${y+size/2}
      ${x-size/2},${y}
    `);

    diamond.setAttribute("fill","#eab308");
    diamond.setAttribute("opacity","0.30");
    diamond.setAttribute("stroke","#ca8a04");
    diamond.setAttribute("stroke-width","3");
    diamond.setAttribute("pointer-events","none");

    g.insertBefore(diamond,g.firstChild);
  }

  const t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",x);
  t.setAttribute("y",y);
  t.setAttribute("text-anchor","middle");
  t.setAttribute("dominant-baseline","middle");

let input=document.getElementById("labelInput").value;

if(input.trim() !== ""){
  t.textContent = input;
}
else{
  t.textContent = `${type} ${counters[type]}`;
  counters[type]++;
}

g.dataset.type = type;

  g.appendChild(t);

  g.dataset.cx=x;
  g.dataset.cy=y;

g.addEventListener("mousedown",e=>{
  selected=g;
  isDragging=true;
  e.stopPropagation();
});

g.addEventListener("contextmenu",e=>{
  e.preventDefault();

  selected = null;
  isDragging = false;

  g.remove();

  relabelBuildings();
  updateCounts();
});


  svg.appendChild(g);
  updateCounts();
}

svg.addEventListener("click",e=>{
  if(selected||isDragging)return;

  const rect=svg.getBoundingClientRect();
  const pos=snap(e.clientX-rect.left,e.clientY-rect.top);

  createBuilding(currentTool,pos.x,pos.y);
});

svg.addEventListener("mousemove",e=>{
  if(!selected)return;

  const rect=svg.getBoundingClientRect();
  const pos=snap(e.clientX-rect.left,e.clientY-rect.top);

  const dx=pos.x-selected.dataset.cx;
  const dy=pos.y-selected.dataset.cy;

  selected.querySelectorAll("polygon").forEach(el=>{
    const pts=el.getAttribute("points").split(" ").map(pt=>{
      let [px,py]=pt.split(",").map(Number);
      return `${px+dx},${py+dy}`;
    }).join(" ");

    el.setAttribute("points",pts);
  });

  const t=selected.querySelector("text");

  if(t){
    t.setAttribute("x",pos.x);
    t.setAttribute("y",pos.y);
  }

  selected.dataset.cx=pos.x;
  selected.dataset.cy=pos.y;
});

function relabelBuildings(){

  const counts = {
    city:1,
    mill:1,
    flag:1,
    bear:1
  };

  document.querySelectorAll("svg g").forEach(g=>{

    const type = g.dataset.type;
    if(!type) return;

    const text = g.querySelector("text");
    if(!text) return;

    if(
      text.textContent.startsWith("city") ||
      text.textContent.startsWith("mill") ||
      text.textContent.startsWith("flag") ||
      text.textContent.startsWith("bear")
    ){
      text.textContent = `${type} ${counts[type]++}`;
    }

  });

  counters.city = counts.city;
  counters.mill = counts.mill;
  counters.flag = counts.flag;
  counters.bear = counts.bear;
}


svg.addEventListener("wheel",e=>{
 e.preventDefault();
 if(e.deltaY<0) zoomLevel*=1.1;
 else zoomLevel/=1.1;
 zoomLevel=Math.max(0.25,Math.min(4,zoomLevel));
 updateView();
});

svg.addEventListener("mousedown",e=>{
 if(e.button===1){
  e.preventDefault();
  panning=true;
  startPanX=e.clientX-panX;
  startPanY=e.clientY-panY;
 }
});

window.addEventListener("mousemove",e=>{
 if(!panning) return;
 panX=e.clientX-startPanX;
 panY=e.clientY-startPanY;
 updateView();
});

window.addEventListener("mouseup",()=>{
 panning=false;
});


svg.addEventListener("mouseup",()=>{
  selected=null;
  setTimeout(()=>isDragging=false,50);
});

</script>

</body>
</html>
